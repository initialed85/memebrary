server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 21m;

    location /api/ {
        proxy_pass http://memebrary-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /media/ {
        # Keep the old public media URL while the backend's compatibility
        # handler lives under djangolang's /api/custom mount.
        proxy_pass http://memebrary-backend:8080/api/custom/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_valid 200 1d;
    }

    location = /healthz {
        proxy_pass http://memebrary-backend:8080/api/healthz;
    }

    # Always revalidate the entrypoint so a new hashed bundle is picked up
    # immediately after a deployment. Hashed assets themselves are immutable.
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
