services:
  backend:
    image: initialed85/memebrary-backend:local
    build: ./backend
    # The Kubernetes pod gets writable volume permissions via fsGroup; local
    # Docker volumes start root-owned, so the dev container runs as root.
    user: "0:0"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      AI_BASE_URL: ${AI_BASE_URL:-http://192.168.137.111:8088/v1}
      AI_MODEL: ${AI_MODEL:-unsloth/Qwen3.6-35B-A3B-MTP-GGUF:UD-Q6_K_XL}
    volumes:
      - memebrary-data:/data
    ports:
      - "8080:8080"
    networks:
      default:
        aliases:
          - memebrary-backend

  frontend:
    image: initialed85/memebrary-frontend:local
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  memebrary-data:
